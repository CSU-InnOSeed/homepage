upstream vercel_app {
    server innoseed-landing.vercel.app:443;
    keepalive 32;
}

# --- HTTP :80 — ACME challenge + 301 ---
server {
    listen 80;
    listen [::]:80;
    server_name innoseed.club www.innoseed.club minicamp.innoseed.club;

    # acme.sh http-01 验证（即使在证书签发前也能 200）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — main site ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name innoseed.club www.innoseed.club minicamp.innoseed.club;

    root /var/www/innoseed;
    index index.html;

    # acme.sh issued wildcard certs (paths come from acme.sh --reloadcmd)
    ssl_certificate     /etc/nginx/ssl/innoseed.club.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/innoseed.club.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # mirror vercel.json headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/innoseed.access.log;
    error_log  /var/log/nginx/innoseed.error.log warn;

    client_max_body_size 5m;

    # cache immutable
    location ~* ^/imgs/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* ^/fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # /api/* → Vercel Function
    location /api/ {
        proxy_pass https://vercel_app;
        proxy_ssl_server_name on;
        proxy_ssl_name innoseed-landing.vercel.app;
        proxy_set_header Host innoseed-landing.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # index.html no-cache + security headers (rerun here because try_files above breaks location inheritance)
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
